name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format, typecheck, test, and build
        run: bun run check
      - name: Verify package tarball
        run: npm pack --dry-run

  publish:
    needs: checks
    # Pushing a vX.Y.Z tag publishes that version to the npm `latest` dist-tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        env:
          REQUESTED_VERSION: ${{ github.ref_name }}
        run: bun run release:check
      - name: Build
        run: bun run build
      - name: Setup Node.js for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.13.0
      - name: Publish
        run: npm publish --provenance --access public
