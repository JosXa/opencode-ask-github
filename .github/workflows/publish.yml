name: OpenCode V2 CI and release

on:
  push:
    branches: [opencode-v2]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact -opencode-v2 package version to publish"
        required: true
        type: string

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format, typecheck, test, and build
        run: bun run check
      - name: Verify package tarball
        run: npm pack --dry-run

  publish:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/opencode-v2'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify release identity and version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          bun run release:check
          test "$GITHUB_REF" = "refs/heads/opencode-v2"
      - name: Re-run release checks
        run: bun run check
      - name: Setup Node.js for npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.13.0
      - name: Publish OpenCode V2 prerelease
        run: npm publish --provenance --access public --tag opencode-v2
